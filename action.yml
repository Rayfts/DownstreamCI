name: DownstreamCI
description: Deterministic reverse-dependency compatibility testing for an upstream repository
author: DownstreamCI

inputs:
  config:
    description: Path to .downstreamci.yml relative to the upstream repository
    required: false
    default: .downstreamci.yml
  runner-image:
    description: Reviewed Docker image used for untrusted downstream execution
    required: false
    default: downstreamci/runner:action
  build-runner:
    description: Build the bundled reviewed runner image before execution
    required: false
    default: "true"
  retries:
    description: Number of baseline/candidate attempts used for flake detection (1-10)
    required: false
    default: "2"
  harness:
    description: Optional verified coding-agent harness for analysis-only failure triage
    required: false
    default: ""
  github-token:
    description: Optional host-side read token used only for cloning private GitHub repositories; never injected into test containers
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install and build DownstreamCI
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        corepack enable
        corepack pnpm install --no-frozen-lockfile
        corepack pnpm build

    - name: Build reviewed runner image
      if: ${{ inputs.build-runner == 'true' }}
      shell: bash
      env:
        DOWNSTREAMCI_ACTION_RUNNER_IMAGE: ${{ inputs.runner-image }}
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        docker build -t "$DOWNSTREAMCI_ACTION_RUNNER_IMAGE" containers/runner

    - name: Run downstream compatibility comparison
      shell: bash
      env:
        DOWNSTREAMCI_ACTION_CONFIG: ${{ inputs.config }}
        DOWNSTREAMCI_ACTION_RUNNER_IMAGE: ${{ inputs.runner-image }}
        DOWNSTREAMCI_ACTION_RETRIES: ${{ inputs.retries }}
        DOWNSTREAMCI_ACTION_HARNESS: ${{ inputs.harness }}
        DOWNSTREAMCI_GITHUB_READ_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        args=(
          run "$GITHUB_WORKSPACE"
          --config "$DOWNSTREAMCI_ACTION_CONFIG"
          --runner-image "$DOWNSTREAMCI_ACTION_RUNNER_IMAGE"
          --retries "$DOWNSTREAMCI_ACTION_RETRIES"
        )
        if [[ -n "$DOWNSTREAMCI_ACTION_HARNESS" ]]; then
          args+=(--harness "$DOWNSTREAMCI_ACTION_HARNESS")
        fi
        node "$GITHUB_ACTION_PATH/apps/cli/dist/index.js" "${args[@]}"

branding:
  icon: activity
  color: orange
